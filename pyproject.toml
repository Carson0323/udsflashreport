[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "udsflashreport"
version = "1.0.2"
description = "确定性的 UDS/ISO-TP 刷写 Trace 故障归因引擎 / Deterministic UDS/ISO-TP flash trace fault attribution engine"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [
    { name = "chaofan", email = "archaofan@gmail.com" },
]
dependencies = [
    "PySide6>=6.6,<6.13",
    "python-can>=4.5",
    "can-isotp>=2.0",
    "udsoncan>=1.22",
    "jsonschema>=4.23",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[project.scripts]
flashreport = "flashreport_core.cli:main"
flashreport-gui = "flashreport_gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flashreport_gui = ["assets/icons/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
qt_api = "pyside6"
